# AEGIS configuration.
# All tunables live here. Secrets never do — those live in .env (gitignored).

watchlist:
  - SPY
  - QQQ
  - AAPL
  - NVDA
  - MSFT

cache:
  ttl_seconds:
    quotes: 5
    chains: 30
    news: 60

bars:
  timeframe: 1Day     # <amount><Min|Hour|Day|Week|Month>; amounts: Min 1-59, Hour 1-23, Day/Week 1, Month 1/2/3/6/12
  lookback_days: 30

# Phase 2 pricing engine (aegis/pricing). Black-Scholes inputs that are not
# observable from a single option quote.
pricing:
  # PLACEHOLDER. The continuously-compounded annual risk-free rate used for
  # discounting and Greeks. It should track the short-term US Treasury yield
  # (e.g. the 3-month T-bill) for the option's tenor; a later phase may source
  # it from a feed. Until then, review it whenever rates move materially.
  risk_free_rate: 0.04
  day_count_basis: 365         # calendar days per year for time-to-expiry (calendar-day convention)
  contract_multiplier: 100     # shares per standard US equity option contract
  expiry_time: "16:00"         # options expire at the exchange close on expiration day...
  expiry_timezone: America/New_York   # ...in this timezone

# Phase 3 persistence (aegis/store): SQLite journal of proposals, decisions,
# orders, fills, and snapshots. Relative paths resolve from the repo root.
# *.db is gitignored.
store:
  db_path: data/aegis.db

# Phase 4 agent brain (aegis/brain): scan -> thesis -> proposal. The brain
# only ever writes reasoning and proposal rows; it has no execution authority.
brain:
  cadence_minutes: 30            # stored now; the Phase 9 scheduler reads it
  max_retries: 3                 # per LLM call: rate limits / transient errors, and per stage: invalid JSON fed back to the model

  # Budget guard — same philosophy as the daily loss limit. Before every call
  # the client sums today's reasoning-table tokens (in + out, UTC day) and
  # this cycle's; if adding the call's estimated input plus max_tokens would
  # cross either line the call is refused and a budget_halt event is logged.
  # PLACEHOLDERS: measured 2026-09-24, a five-symbol cycle spends ~22k tokens
  # when it declines at the thesis stage and ~30k with a proposal, so 60k
  # absorbs a retry or two and 500k/day covers the ~13 cycles of a market day
  # at cadence_minutes=30 with room for manual runs. Tune after a week.
  per_cycle_token_cap: 60000
  daily_token_budget: 500000

  # One model per stage. temperature is deliberately absent: the current
  # Messages API / anthropic 1.x SDK does not accept it for these models (400);
  # effort (low|medium|high|xhigh|max) is the knob, and Haiku 4.5 takes none.
  # Thinking is always on for Opus 5.5 / Fable 5.1 and its tokens count
  # toward max_tokens, so keep effort modest where max_tokens is small.
  stages:
    scan:
      model: claude-haiku-4-5-20251001
      # Measured 2026-09-24: a terse five-symbol brief (scan-v2) needs ~1,700
      # output tokens; 1,500 truncated it. Scale with the watchlist size.
      max_tokens: 3000
      effort: null
    thesis:
      model: claude-opus-5-5
      # Measured 2026-09-24: one candidate on a two-symbol snapshot took 1,210
      # tokens (thinking + JSON); up to five candidates need headroom.
      max_tokens: 4000
      effort: medium
    proposal:
      model: claude-fable-5-1
      # Measured 2026-09-24: 800 truncated — thinking used ~670 before the
      # ~500-token proposal JSON began.
      max_tokens: 3000
      effort: low

  # PLACEHOLDERS for cost ESTIMATES only (USD per million tokens). Update from
  # the official pricing page: https://platform.claude.com/docs/en/about-claude/pricing
  prices_per_mtok:
    claude-haiku-4-5-20251001: {input: 1.00, output: 5.00}
    claude-opus-5-5: {input: 4.00, output: 20.00}
    claude-fable-5-1: {input: 10.00, output: 50.00}

  # What the scan stage sees per watchlist symbol.
  snapshot:
    strikes_each_side: 5          # ATM +/- N strikes of the nearest expiry, calls and puts
    headlines_per_symbol: 5
    stale_after_minutes: 15       # data older than this (or any data while closed) is flagged STALE
    recent_proposals_limit: 10    # prior proposals shown to the thesis stage so it does not repeat itself

# Risk limits enforced by the Phase 5 policy engine (aegis/policy) — the
# deterministic gate between a proposal and any order. The engine runs all
# twenty rules on every proposal and nothing in aegis/policy hardcodes a
# number: every limit is read from this block.
#
# EVERY VALUE BELOW IS A PLACEHOLDER sized for the $100k PAPER account. Live
# sizing gets revisited before Phase 11; do not carry these numbers to a live
# account unreviewed.
risk_limits:
  # --- account-level stops -----------------------------------------------
  # Today's P&L at or below this % of start-of-day equity: REJECT, and halt
  # until the next market open — or, when the limit trips before the day's
  # session opens, until that session's close.
  daily_loss_limit_pct: 2.0
  halt_fallback_hours: 24        # halt length when the limit trips but the market clock (next open) is unavailable
  max_daily_trades: 10           # orders sent to the broker per trading day; at the cap, REJECT
  max_open_positions: 5          # distinct underlyings held or pending; at the cap, a NEW underlying is REJECTed

  # --- what may be traded ------------------------------------------------
  no_trade_list: []              # symbols (and underlyings) that are always REJECTed
  watchlist_only: true           # REJECT anything whose underlying is not in the watchlist above

  # --- sizing ------------------------------------------------------------
  max_position_pct: 5.0          # this proposal's notional + existing exposure in the underlying, as % of equity

  # --- order hygiene -----------------------------------------------------
  duplicate_window_minutes: 60   # same symbol + instrument + side inside this window is a duplicate
  allow_market_orders: false     # market orders are REJECTed unless true
  limit_price_tolerance_pct: 5.0 # a limit further than this from the current mid is REJECTed

  # --- options -----------------------------------------------------------
  # min_dte counts calendar days from the trading date to expiration: 1
  # rejects same-day (0DTE) contracts and nothing else. The brain currently
  # reads the nearest expiration, usually 0-1 DTE on these tickers, so a
  # stricter value here should be paired with a later chain on the brain side.
  min_dte: 1
  max_loss_per_trade: 1000.0     # USD at risk for the whole structure; unlimited risk is REJECTed whatever this says
  max_contracts: 10              # per leg

  # --- tiers -------------------------------------------------------------
  reject_short_sales: false      # an equity sell that does not close a long: false = needs approval, true = REJECT
  min_confidence: 0.5            # below this the proposal is recorded and flagged, never executed
  auto_execute:                  # the only path to an order without a human: equity, limit, watchlist, small
    enabled: true                # paper default; options never auto-execute in this phase
    max_notional: 1000.0         # USD
